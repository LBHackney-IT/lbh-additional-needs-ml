repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      # Run the linter & auto-fix fixable errors
      - id: ruff
        args: [--fix]
      # Run the Ruff formatter (replaces Black)
      - id: ruff-format