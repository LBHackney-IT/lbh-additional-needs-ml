name: Inference Lint and Test

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
  push:
    branches-ignore:
      - main
    paths:
      - "inference/**"
      - ".github/workflows/inference_test.yml"
  pull_request:
    paths:
      - "inference/**"
      - ".github/workflows/inference_test.yml"

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      
      - name: Assume deployment role
        uses: LBHackney-IT/aws-oidc-auth@v1.2.0
        with:
          apiUrl: https://ci-auth.hackney.gov.uk
          roleArn: arn:aws:iam::${{ secrets.ACCOUNT_NAME }}:role/LBH_Automation_Deployment_Role

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd inference
          pip install -e ".[dev]"

      - name: Lint
        run: |
          cd inference
          ruff check src tests launch_sagemaker.py

      - name: Run tests with coverage
        working-directory: inference
        run: |
          pytest --cov=src --cov-report=xml:coverage.xml tests/

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
