name: Publish inference image

on:
  push:
    branches:
      - main
    paths:
      - "inference/**"
      - ".github/workflows/inference_test.yml"
      - ".github/workflows/inference_publish.yml"

jobs:
  # test:
  #   uses: ./.github/workflows/inference_test.yml
  #   secrets:
  #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    name: Build & Publish Inference Image
    # needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-west-2
      ECR_REPOSITORY: housing-additional-needs-ml
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Assume deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.ACCOUNT }}:role/LBH_Automation_Deployment_Role_OIDC
          role-session-name: aws-oidc-session
          aws-region: eu-west-2
          retry-max-attempts: "3"

      - name: Log in to Amazon ECR (Private for pushing final image)
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to Amazon ECR Public (For pulling PyTorch base image)
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          test -n "$ECR_REPOSITORY"
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build --tag "$IMAGE:$IMAGE_TAG" inference
          docker push "$IMAGE:$IMAGE_TAG"
