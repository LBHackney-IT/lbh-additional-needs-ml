[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "additional-needs-inference"
version = "0.1.0"
description = "Production batch inference container for Additional Needs extraction"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.2",
    "pyarrow>=14.0",
    "pydantic>=2.0",
    "safetensors>=0.4",
    "sentencepiece",
    "protobuf",
    "torch>=2.1",
    "transformers>=4.46",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
run-inference = "src.run_inference:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Select rules: Pyflakes (F), pycodestyle (E, W), isort (I), UPgrade syntax (UP), Pydantic (N)
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"] # Ignore line length errors if ruff-format handles it

[tool.ruff.format]
quote-style = "double"
indent-style = "space"